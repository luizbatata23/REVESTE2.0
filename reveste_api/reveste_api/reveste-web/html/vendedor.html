<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Vendedor</title>
  <link rel="stylesheet" href="../css/vendedor.css">
</head>
<body>

<div class="box">
  <h2>Cadastro de Vendedor</h2>

  <input id="nome" placeholder="Nome completo">
  <span class="err" id="err-nome"></span>

  <input id="cpf" placeholder="CPF ou CNPJ">
  <span class="err" id="err-cpf"></span>

  <input id="loja" placeholder="Nome da loja">
  <span class="err" id="err-loja"></span>

  <input id="telefone" placeholder="Telefone (ex: 67912345678)">
  <span class="err" id="err-telefone"></span>

  <input id="email" placeholder="Email">
  <span class="err" id="err-email"></span>

  <button onclick="cadastrar()">Cadastrar</button>

  <div id="msg" class="msg"></div>
</div>

<script src="../js/vendedor.js"></script>
</body>
</html>
